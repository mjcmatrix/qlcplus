name: Matrix fork release build

# Fork-only workflow (stays off upstream). Builds QLC+ 5 (QML UI) for Linux
# (Ubuntu + Debian AppImages), macOS and Windows with a recent Qt, and
# publishes the results as GitHub releases:
#   - nightly: rolling pre-release tagged "nightly", built from the default branch
#   - stable:  a release per pushed tag of the form v<upstream version>-matrix.<N>
# The version is stamped as "<upstream version>-matrix.<N>" (stable) or
# "<upstream version>-matrix.nightly.<date>.<sha>" (nightly).

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*-matrix.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [nightly, stable]
        default: nightly
      ref:
        description: "Branch or tag to build (default: the branch the workflow runs on)"
        type: string
        required: false
      publish:
        description: "Publish a release (untick to only build and keep the artifacts)"
        type: boolean
        default: true

env:
  QT_VERSION: "6.11.2"
  QT_MODULES: "qt3d qtimageformats qtmultimedia qtserialport qtwebsockets"

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare version
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      sha: ${{ steps.v.outputs.sha }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      - name: Work out channel and version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          SHA=$(git rev-parse HEAD)
          UPSTREAM=$(sed -n '/^if(qmlui)/,/^else()/ s/.*set(APPVERSION "\([^"]*\)").*/\1/p' variables.cmake)
          [ -n "$UPSTREAM" ] || { echo "Cannot parse upstream APPVERSION from variables.cmake"; exit 1; }

          BUILD=true
          PUBLISH=true
          if [ "$EVENT" == "push" ]; then
            CHANNEL=stable
            TAG="${GITHUB_REF_NAME}"
          elif [ "$EVENT" == "workflow_dispatch" ]; then
            CHANNEL='${{ inputs.channel }}'
            PUBLISH='${{ inputs.publish }}'
            TAG="${GITHUB_REF_NAME}"
          else
            CHANNEL=nightly
            TAG=""
          fi

          if [ "$CHANNEL" == "stable" ]; then
            case "$TAG" in
              v*-matrix.*) N="${TAG##*-matrix.}" ;;
              *) echo "Stable builds must be run from a tag like v${UPSTREAM}-matrix.1 (got '$TAG')"; exit 1 ;;
            esac
            VERSION="${UPSTREAM}-matrix.${N}"
            RELTAG="$TAG"
          else
            VERSION="${UPSTREAM}-matrix.nightly.$(date -u +%Y%m%d).${SHA:0:7}"
            RELTAG=nightly
            # skip scheduled nightlies when nothing changed since the last one
            if [ "$EVENT" == "schedule" ]; then
              LAST=$(git ls-remote --tags origin refs/tags/nightly | cut -f1)
              if [ "$LAST" == "$SHA" ]; then
                echo "No new commits since the last nightly ($SHA); skipping"
                BUILD=false
              fi
            fi
          fi

          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "tag=$RELTAG"
            echo "ref=${{ inputs.ref || github.ref }}"
            echo "sha=$SHA"
            echo "build=$BUILD"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL  Version: $VERSION  Release tag: $RELTAG  Build: $BUILD  Publish: $PUBLISH"

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            container: ""
            asset: ubuntu
          - name: debian
            container: debian:stable
            asset: debian
    env:
      QTDIR: /opt/Qt/6.11.2/gcc_64
      APPIMAGE_EXTRACT_AND_RUN: 1
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      APPVERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Install base packages (Debian container)
        if: ${{ matrix.name == 'debian' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git wget file sudo build-essential cmake make pkg-config \
            python3 python3-pip python3-venv python3-lxml ccache \
            gdb libasound2-dev libusb-1.0-0-dev libftdi1-dev shared-mime-info libudev-dev \
            libmad0-dev libsndfile1-dev liblo-dev libfftw3-dev libgl1-mesa-dev libxml2-utils \
            xvfb xauth chrpath libfuse2 libpulse-dev \
            libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-randr0 libxrender1 libxi6 libglib2.0-0

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false

      - name: Install packages (Ubuntu)
        if: ${{ matrix.name == 'ubuntu' }}
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            gdb libasound2-dev libusb-1.0-0-dev libftdi1-dev shared-mime-info libudev-dev
            libmad0-dev libsndfile1-dev liblo-dev libfftw3-dev libgl1-mesa-dev libxml2-utils
            xvfb chrpath libfuse2 wget libpulse-dev
          version: ${{ runner.os }}-apt-release

      - name: Install Qt (Ubuntu)
        if: ${{ matrix.name == 'ubuntu' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          dir: /opt
          modules: ${{ env.QT_MODULES }}

      - name: Install python-lxml for fixtures-tool (Ubuntu)
        if: ${{ matrix.name == 'ubuntu' }}
        run: pip install lxml

      # install-qt-action wants setup-python, which is unreliable inside a
      # container, so use aqt from a venv there
      - name: Install Qt (Debian)
        if: ${{ matrix.name == 'debian' }}
        run: |
          python3 -m venv /opt/aqt-venv
          /opt/aqt-venv/bin/pip install aqtinstall
          /opt/aqt-venv/bin/aqt install-qt linux desktop ${QT_VERSION} linux_gcc_64 \
            -O /opt/Qt -m ${QT_MODULES}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: release-linux-${{ matrix.name }}

      - name: Stamp version
        run: |
          sed -i '/^if(qmlui)/,/^else()/ s/set(APPVERSION "[^"]*")/set(APPVERSION "'"${APPVERSION}"'")/' variables.cmake
          grep -n 'set(APPVERSION' variables.cmake

      # create-appimage.sh configures, builds, runs the unit tests ("make check"),
      # installs and packs the AppImage into $HOME
      - name: Build, test and package AppImage
        run: |
          export PATH="$QTDIR/bin:$PATH"
          export LD_LIBRARY_PATH="$QTDIR/lib:${LD_LIBRARY_PATH:-}"
          ./create-appimage.sh qmlui
          mv -v "$HOME/Q_Light_Controller_Plus_-_QLC+-x86_64.AppImage" \
            "qlcplus5-matrix-${APPVERSION}-${{ matrix.asset }}-x86_64.AppImage"

      - name: Smoke test AppImage
        run: |
          xvfb-run -a ./qlcplus5-matrix-${APPVERSION}-${{ matrix.asset }}-x86_64.AppImage --version

      - name: Store artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.name }}
          path: qlcplus5-matrix-${{ env.APPVERSION }}-${{ matrix.asset }}-x86_64.AppImage

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Windows
    runs-on: windows-latest
    env:
      APPVERSION: ${{ needs.prepare.outputs.version }}
      QTDIR: /d/a/qlcplus/qlcplus/qt/Qt/6.11.2/mingw_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: release-windows

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          # released aqtinstall (3.3.0) doesn't know the Qt 6.11 Windows repository layout yet
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          dir: "${{ github.workspace }}/qt/"
          modules: ${{ env.QT_MODULES }}

      - name: Update and install MSYS2 (64bit)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: true
          update: false
          path-type: inherit
          install: >-
            wget
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-nsis

      - name: D2XX SDK (64 bit)
        shell: msys2 {0}
        run: |
          mkdir -p /c/projects/D2XXSDK
          wget https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O /c/projects/D2XXSDK/cdm.zip
          cd /c/projects/D2XXSDK
          unzip cdm.zip
          cd amd64
          gendef.exe - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Fix build and stamp version
        shell: msys2 {0}
        run: |
          # force a release build
          sed -i -e 's/Debug/Release/g' CMakeLists.txt
          # disable Velleman plugin
          sed -i -e 's/    add_subdirectory(velleman)/#    add_subdirectory(velleman)/g' plugins/CMakeLists.txt
          # fix MSYS2 system path
          sed -i -e 's/$ENV{SystemDrive}\/msys64/D:\/a\/_temp\/msys64/g' platforms/windows/CMakeLists.txt
          # fix project path in NSIS script
          sed -i -e 's/c\:\\projects/d:\\a\\qlcplus/g' platforms/windows/qlcplus5Qt6.nsi
          # version in installer name and in the application
          sed -i -e "s/^OutFile \".*\"/OutFile \"QLC+_${APPVERSION}.exe\"/" platforms/windows/qlcplus5Qt6.nsi
          sed -i '/^if(qmlui)/,/^else()/ s/set(APPVERSION "[^"]*")/set(APPVERSION "'"${APPVERSION}"'")/' variables.cmake
          grep -n 'OutFile' platforms/windows/qlcplus5Qt6.nsi
          grep -n 'set(APPVERSION' variables.cmake

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${QTDIR}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -Dqmlui=ON

      - name: Build
        shell: msys2 {0}
        run: |
          cd build
          ninja

      - name: Install
        shell: msys2 {0}
        run: |
          cd build
          ninja install

      - name: Run windeployqt
        shell: msys2 {0}
        run: |-
          SRC_DIR=$PWD
          ./translate.sh release qmlui
          cp *.qm /c/qlcplus
          cd /c/qlcplus
          ${QTDIR}/bin/windeployqt --qmldir $SRC_DIR/qmlui/qml qlcplus5.exe qlcplusengine.dll plugins/dmxusb.dll

      - name: Build installation package
        shell: msys2 {0}
        run: |
          cd /c/qlcplus
          makensis -X'SetCompressor /FINAL lzma' qlcplus5Qt6.nsi
          mv "/c/qlcplus/QLC+_${APPVERSION}.exe" "/d/a/qlcplus/qlcplus/qlcplus5-matrix-${APPVERSION}-windows-x64.exe"

      - name: Store artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: qlcplus5-matrix-${{ env.APPVERSION }}-windows-x64.exe

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: macOS
    runs-on: macos-latest
    env:
      APPVERSION: ${{ needs.prepare.outputs.version }}
      MACOS_KEYCHAIN: build.keychain
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false

      - name: Set ENV variables
        shell: bash
        run: |
          echo "QTDIR=${{ github.workspace }}/qt/Qt/${QT_VERSION}/macos" >> $GITHUB_ENV
          echo "NPROC=`sysctl -n hw.ncpu`" >> $GITHUB_ENV

      - name: Dependencies
        run: |
          brew update
          brew install fftw mad libsndfile libftdi
          brew link --overwrite python@3.14

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          dir: "${{ github.workspace }}/qt/"
          target: 'desktop'
          arch: 'clang_64'
          modules: ${{ env.QT_MODULES }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: release-macos

      - name: Stamp version
        shell: bash
        run: |
          sed -i '' '/^if(qmlui)/,/^else()/ s/set(APPVERSION "[^"]*")/set(APPVERSION "'"${APPVERSION}"'")/' variables.cmake
          grep -n 'set(APPVERSION' variables.cmake

      - name: Configure
        shell: bash
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${QTDIR}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -Dqmlui=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: |-
          cd build
          make -j${NPROC}

      - name: Install
        shell: bash
        run: |-
          cd build
          make install/fast

      - name: Fix dylib dependencies
        shell: bash
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus5
          ${QTDIR}/bin/macdeployqt ~/QLC+.app -qmldir=qmlui/qml

      - name: Import macOS signing certificate
        # done right before signing: a new keychain auto-locks after 5 minutes,
        # and a locked keychain makes codesign hang waiting for a password prompt
        shell: bash
        if: ${{ env.MACOS_CERT_P12 != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |-
          echo "${MACOS_CERT_P12}" | base64 --decode > $RUNNER_TEMP/macos_cert.p12
          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${MACOS_KEYCHAIN}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          security list-keychains -d user -s "${MACOS_KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security import $RUNNER_TEMP/macos_cert.p12 -k "${MACOS_KEYCHAIN}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o $RUNNER_TEMP/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k "${MACOS_KEYCHAIN}" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          rm -f $RUNNER_TEMP/macos_cert.p12 $RUNNER_TEMP/DeveloperIDG2CA.cer
          security find-identity -v -p codesigning "${MACOS_KEYCHAIN}"

      - name: Sign app bundle
        shell: bash
        if: ${{ env.MACOS_CERT_P12 != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        timeout-minutes: 20
        run: |-
          platforms/macos/sign_app.sh ~/QLC+.app "${MACOS_CODESIGN_IDENTITY}"

      - name: Create DMG
        # Retry loop to work around 'Resource busy' errors with 'hdiutil'. See
        # https://github.com/actions/runner-images/issues/7522
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 12
          retry_wait_seconds: 1
          command: |
            OUTDIR=$PWD
            cd platforms/macos/dmg
            ./create-dmg --volname "Q Light Controller Plus ${{ env.APPVERSION }}" \
            --volicon $OUTDIR/resources/icons/qlcplus.icns \
            --background background.png \
            --window-size 400 300 \
            --window-pos 200 100 \
            --icon-size 64 \
            --icon "QLC+" 0 150 \
            --app-drop-link 200 150 \
            $OUTDIR/qlcplus5-matrix-${{ env.APPVERSION }}-macos.dmg \
            ~/QLC+.app

      - name: Sign DMG
        shell: bash
        if: ${{ env.MACOS_CERT_P12 != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |-
          codesign --force --timestamp --sign "${MACOS_CODESIGN_IDENTITY}" "qlcplus5-matrix-${APPVERSION}-macos.dmg"

      - name: Notarize and staple DMG
        shell: bash
        if: ${{ env.MACOS_CERT_P12 != '' && env.MACOS_CODESIGN_IDENTITY != '' && env.MACOS_NOTARY_KEY_P8 != '' }}
        timeout-minutes: 45
        run: |-
          DMG_PATH="qlcplus5-matrix-${APPVERSION}-macos.dmg"
          echo "${MACOS_NOTARY_KEY_P8}" > $RUNNER_TEMP/AuthKey.p8
          xcrun notarytool submit \
            --key $RUNNER_TEMP/AuthKey.p8 \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER}" \
            --wait --timeout 40m "${DMG_PATH}"
          xcrun stapler staple "${DMG_PATH}"
          rm -f $RUNNER_TEMP/AuthKey.p8

      - name: Store artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: qlcplus5-matrix-${{ env.APPVERSION }}-macos.dmg

      - name: Cleanup keychain
        shell: bash
        if: ${{ always() && env.MACOS_CERT_P12 != '' }}
        run: |-
          security delete-keychain "${MACOS_KEYCHAIN}" || true

  release:
    needs: [prepare, build-linux, build-windows, build-macos]
    # publish whatever platforms succeeded; a failed platform doesn't block the rest
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && needs.prepare.outputs.publish == 'true' && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    name: Publish ${{ needs.prepare.outputs.channel }} release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          ls -l assets
          UP=${VERSION%%-matrix*}
          NOTES=notes.md
          {
            echo "QLC+ 5 (QML UI) fork build of upstream ${UP} plus the fork's changes, version \`${VERSION}\`, commit \`${SHA:0:9}\`, built with Qt ${QT_VERSION}."
            echo
            echo "- Linux: \`*-ubuntu-x86_64.AppImage\` (Ubuntu) and \`*-debian-x86_64.AppImage\` (built on Debian stable; the more portable one)"
            echo "- macOS: \`*-macos.dmg\` (Apple silicon/arm64 build host)"
            echo "- Windows: \`*-windows-x64.exe\`"
            echo
            echo "macOS builds are signed and notarized only when the signing secrets are configured; Windows installers are unsigned."
            echo
          } > $NOTES

          if [ "$CHANNEL" == "nightly" ]; then
            # move the rolling tag to this commit and replace the release
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            git tag -f nightly "$SHA"
            git push -f origin refs/tags/nightly
            gh release create nightly assets/* --prerelease \
              --title "Nightly ${VERSION}" --notes-file $NOTES --verify-tag
          else
            PREV=$(git tag --list 'v*-matrix.*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}" >> $NOTES
            fi
            gh release create "$TAG" assets/* --title "QLC+ ${VERSION}" \
              --notes-file $NOTES --generate-notes --verify-tag
          fi
